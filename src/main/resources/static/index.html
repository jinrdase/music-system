<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>潮流音乐专辑及衍生品发售系统</title>
  <style>
    :root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#202231;background:#f5f6fa}*{box-sizing:border-box}body{margin:0}header{background:#211b37;color:#fff;padding:18px max(20px,calc((100% - 1100px)/2));display:flex;justify-content:space-between;align-items:center}main{max-width:1100px;margin:24px auto;padding:0 18px}.panel{background:#fff;border:1px solid #e8e8ef;border-radius:14px;padding:20px;margin:16px 0;box-shadow:0 4px 18px #2019360c}nav{display:flex;gap:8px;flex-wrap:wrap}.tab,button{border:0;border-radius:8px;padding:10px 14px;background:#7049ce;color:white;cursor:pointer}.tab{background:#ebe7f7;color:#33244f}.tab.active{background:#7049ce;color:white}input,select{padding:10px;border:1px solid #d7d8e1;border-radius:8px;margin:4px;max-width:100%}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{border:1px solid #ececf2;border-radius:12px;padding:14px}.card img{width:100%;height:150px;object-fit:cover;border-radius:8px;background:#eee}.muted{color:#707386}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.hidden{display:none}#notice{padding:10px;border-radius:8px;background:#f0edfa;margin:12px 0;white-space:pre-wrap}pre{white-space:pre-wrap;overflow-wrap:anywhere}.danger{background:#b33c56}footer{color:#777;text-align:center;padding:30px}
  </style>
</head>
<body>
<header><strong>潮流音乐专辑及衍生品发售系统</strong><span id="account">未登录</span></header>
<main>
  <section id="auth" class="panel">
    <h2>登录 / 注册</h2>
    <div class="row"><input id="username" placeholder="用户名"><input id="password" type="password" placeholder="密码"><button onclick="login()">登录</button></div>
    <details><summary>创建普通用户账号</summary><div class="row"><input id="regNickname" placeholder="昵称"><input id="regPhone" placeholder="手机号（可选）"><button onclick="register()">注册</button></div></details>
  </section>
  <section id="workspace" class="hidden">
    <nav class="panel"><button class="tab active" data-page="albums">专辑</button><button class="tab" data-page="cart">购物车</button><button class="tab" data-page="orders">订单</button><button class="tab" data-page="refunds">退款</button><button class="tab" data-page="addresses">收货地址</button><button class="tab" data-page="boxes">盲盒</button><button class="tab admin hidden" data-page="admin">后台</button><button class="danger" onclick="logout()">退出</button></nav>
    <div id="notice" role="status">登录后可访问系统功能。</div>
    <section id="page-albums" class="panel"><div class="row"><h2>在售专辑</h2><input id="albumKeyword" placeholder="搜索专辑或艺人"><button onclick="loadAlbums()">搜索</button></div><div id="albums" class="grid"></div></section>
    <section id="page-cart" class="panel hidden"><h2>购物车</h2><div id="cart"></div></section>
    <section id="page-orders" class="panel hidden"><h2>我的订单</h2><div id="orders"></div></section>
    <section id="page-refunds" class="panel hidden"><h2>退款申请</h2><div id="refunds"></div><div class="admin hidden"><button onclick="loadPendingRefunds()">管理员查看待审核申请</button><div id="pendingRefunds"></div></div></section>
    <section id="page-addresses" class="panel hidden"><h2>收货地址</h2><div class="row"><input id="receiverName" placeholder="收件人"><input id="receiverPhone" placeholder="手机号"><input id="province" placeholder="省"><input id="city" placeholder="市"><input id="district" placeholder="区县"><input id="detailAddress" placeholder="详细地址"><button onclick="addAddress()">添加地址</button></div><div id="addresses"></div></section>
    <section id="page-boxes" class="panel hidden"><h2>盲盒</h2><p class="muted">当前可查看在售盲盒；抽取功能需完成支付闭环后开放。</p><div id="boxes" class="grid"></div></section>
    <section id="page-admin" class="panel hidden"><h2>管理工具</h2><h3>创建专辑</h3><div class="row"><input id="newTitle" placeholder="专辑名"><input id="newArtist" placeholder="艺人"><input id="newPrice" type="number" min="0.01" step="0.01" placeholder="价格"><input id="newStock" type="number" min="0" placeholder="库存"><select id="newProductType"><option value="PHYSICAL">实物</option><option value="DIGITAL">数字</option></select><input id="newContentUrl" placeholder="数字内容 HTTPS 地址"><input id="newCover" placeholder="封面 URL"><button onclick="createAlbum()">创建并上架</button></div><h3>用户角色</h3><div class="row"><input id="targetUserId" type="number" placeholder="用户编号"><select id="targetRole"><option>user</option><option>admin</option><option>super_admin</option></select><button onclick="changeRole()">修改角色（超级管理员）</button></div><h3>媒体上传</h3><input id="mediaFile" type="file"><select id="mediaType"><option value="image">图片</option><option value="audio">音频</option></select><button onclick="uploadMedia()">上传</button><h3>操作审计</h3><button onclick="loadAudit()">读取操作记录</button><pre id="adminOutput"></pre></section>
  </section>
</main>
<footer>开发验证界面 · 所有业务操作仍由后端权限和校验规则控制</footer>
<script>
const tokenKey='music-system-token';let token=sessionStorage.getItem(tokenKey);let currentPage='albums';
const $=id=>document.getElementById(id);function notify(text){$('notice').textContent=text}
async function api(path,options={}){const headers=new Headers(options.headers||{});if(token)headers.set('Authorization','Bearer '+token);if(options.body&&!headers.has('Content-Type')&&!(options.body instanceof FormData))headers.set('Content-Type','application/json');const response=await fetch(path,{...options,headers});const body=await response.json().catch(()=>({message:'服务器返回了无法识别的内容'}));if(!response.ok||body.code!==200)throw new Error(body.message||('HTTP '+response.status));return body.data}
function showApp(){ $('auth').classList.toggle('hidden',!!token);$('workspace').classList.toggle('hidden',!token);$('account').textContent=token?'已登录':'未登录';if(token){loadAlbums();loadAddresses();document.querySelectorAll('.admin').forEach(e=>e.classList.toggle('hidden',!sessionStorage.getItem('music-system-admin')))}}
async function login(){try{const d=await api('/api/user/login',{method:'POST',body:JSON.stringify({username:$('username').value,password:$('password').value})});token=d.token;sessionStorage.setItem(tokenKey,token);if(d.userInfo&&['admin','super_admin'].includes(d.userInfo.role))sessionStorage.setItem('music-system-admin','1');showApp();notify('登录成功。')}catch(e){notify(e.message)}}
async function register(){try{const d=await api('/api/user/register',{method:'POST',body:JSON.stringify({username:$('username').value,password:$('password').value,confirmPassword:$('password').value,nickname:$('regNickname').value||$('username').value,phone:$('regPhone').value||null})});notify('注册成功，用户编号：'+d.id+'。请登录。')}catch(e){notify(e.message)}}
function logout(){sessionStorage.clear();token=null;showApp()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{currentPage=b.dataset.page;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===b));document.querySelectorAll('[id^="page-"]').forEach(p=>p.classList.toggle('hidden',p.id!=='page-'+currentPage));({albums:loadAlbums,cart:loadCart,orders:loadOrders,refunds:loadRefunds,addresses:loadAddresses,boxes:loadBoxes,admin:()=>{}}[currentPage]||(()=>{}))()});
async function loadAlbums(){try{const d=await api('/api/album/list?current=1&size=30&keyword='+encodeURIComponent($('albumKeyword').value));$('albums').innerHTML=(d.records||[]).map(a=>`<article class="card"><img src="${escapeHtml(a.coverUrl||'')}" alt=""><h3>${escapeHtml(a.title)}</h3><p>${escapeHtml(a.artist)} · ${escapeHtml(a.productType||'PHYSICAL')}</p><p>¥${a.price} · 库存 ${a.stock}</p><div class="row"><input id="qty-${a.id}" type="number" min="1" value="1" style="width:75px"><button onclick="addCart(${a.id})">加入购物车</button><button onclick="createOrder(${a.id},'${a.productType||'PHYSICAL'}')">立即下单</button></div></article>`).join('')||'<p>暂无在售专辑</p>'}catch(e){notify(e.message)}}
async function addCart(id){try{await api('/api/cart/add',{method:'POST',body:JSON.stringify({albumId:id,quantity:Number($('qty-'+id).value)})});notify('已加入购物车。')}catch(e){notify(e.message)}}
async function loadCart(){try{const d=await api('/api/cart/list');const rows=(d.items||[]).map(i=>`<div class="card row"><span>${escapeHtml(i.albumName)} × ${i.quantity} · ¥${i.subtotal}</span><button onclick="api('/api/cart/toggleSelect/${i.id}?isSelected=${i.isSelected?0:1}',{method:'PUT'}).then(loadCart).catch(e=>notify(e.message))">${i.isSelected?'取消选择':'选择'}</button><button class="danger" onclick="api('/api/cart/remove/${i.id}',{method:'DELETE'}).then(loadCart).catch(e=>notify(e.message))">删除</button></div>`).join('');$('cart').innerHTML=`<p>已选 ${d.selectedCount} 件，合计 ¥${d.selectedAmount}</p>${rows}<p class="muted">购物车订单请在专辑页选择商品并下单；服务端当前按单商品创建订单。</p>`}catch(e){notify(e.message)}}
async function createOrder(albumId,type){try{let addressId=null;if(type.toUpperCase()==='PHYSICAL'){const a=await api('/api/address/default');addressId=a&&a.id;if(!addressId){notify('实物商品需要先添加并设置默认收货地址。');currentPage='addresses';document.querySelector('[data-page="addresses"]').click();return}}const body={albumId,quantity:Number($('qty-'+albumId).value),remark:'网页下单'};if(addressId)body.addressId=addressId;const d=await api('/api/order/create',{method:'POST',body:JSON.stringify(body)});notify('订单已创建：'+d.orderNo+'。请继续接入支付渠道完成付款。')}catch(e){notify(e.message)}}
async function loadOrders(){try{const d=await api('/api/order/my?current=1&size=30');$('orders').innerHTML=(d.records||[]).map(o=>`<article class="card"><b>${escapeHtml(o.albumTitle)}</b><p>订单 ${escapeHtml(o.orderNo)} · 状态 ${o.statusText||o.status}</p><p>数量 ${o.quantity} · 金额 ¥${o.totalAmount} · ${o.productType||''}</p>${o.productType==='DIGITAL'&&[1,2].includes(o.status)?`<button onclick="getDigital('${o.orderNo}')">获取数字内容</button>`:''}${[1,4].includes(o.status)?`<button onclick="applyRefund(${o.id})">申请退款</button>`:''}${o.status===4?`<button onclick="api('/api/order/confirmReceipt/${o.orderNo}',{method:'POST'}).then(loadOrders).catch(e=>notify(e.message))">确认收货</button>`:''}</article>`).join('')||'<p>暂无订单</p>'}catch(e){notify(e.message)}}
async function applyRefund(orderId){const reason=prompt('请填写退款原因');if(!reason)return;try{await api('/api/refund/apply',{method:'POST',body:JSON.stringify({orderId,reason})});notify('退款申请已提交。');loadRefunds()}catch(e){notify(e.message)}}
async function loadRefunds(){try{const d=await api('/api/refund/my?current=1&size=30');$('refunds').innerHTML=(d.records||[]).map(r=>`<article class="card">订单 ${escapeHtml(r.orderNo)} · 退款 ¥${r.refundAmount} · 状态 ${r.status}<p>${escapeHtml(r.reason)}</p></article>`).join('')||'<p>暂无退款申请</p>'}catch(e){notify(e.message)}}
async function loadPendingRefunds(){try{const d=await api('/api/refund/admin/pending?current=1&size=30');$('pendingRefunds').innerHTML=(d.records||[]).map(r=>`<article class="card">订单 ${escapeHtml(r.orderNo)} · 用户 ${r.userId} · ¥${r.refundAmount} <button onclick="reviewRefund(${r.id},true)">通过</button><button class="danger" onclick="reviewRefund(${r.id},false)">拒绝</button></article>`).join('')||'<p>当前没有待审申请</p>'}catch(e){notify(e.message)}}
async function reviewRefund(id,approved){const auditRemark=prompt('审核备注')||'';try{await api('/api/refund/admin/'+id+'/review',{method:'PUT',body:JSON.stringify({approved,auditRemark})});loadPendingRefunds()}catch(e){notify(e.message)}}
async function getDigital(no){try{const url=await api('/api/order/'+encodeURIComponent(no)+'/digital-content');notify('已验证订单所有权与支付状态。内容地址：'+url)}catch(e){notify(e.message)}}
async function loadAddresses(){try{const d=await api('/api/address/list');$('addresses').innerHTML=(d||[]).map(a=>`<div class="card row">${escapeHtml(a.receiverName)} ${escapeHtml(a.receiverPhone)} · ${escapeHtml(a.fullAddress||[a.province,a.city,a.district,a.detailAddress].join(' '))} ${a.isDefault?'（默认）':''}<button onclick="api('/api/address/setDefault/${a.id}',{method:'PUT'}).then(loadAddresses).catch(e=>notify(e.message))">设为默认</button></div>`).join('')||'<p>暂无地址</p>'}catch(e){notify(e.message)}}
async function addAddress(){try{await api('/api/address/add',{method:'POST',body:JSON.stringify({receiverName:$('receiverName').value,receiverPhone:$('receiverPhone').value,province:$('province').value,city:$('city').value,district:$('district').value,detailAddress:$('detailAddress').value,isDefault:1})});notify('地址已添加。');loadAddresses()}catch(e){notify(e.message)}}
async function loadBoxes(){try{const d=await api('/api/blind-box/list?current=1&size=30');$('boxes').innerHTML=(d.records||[]).map(b=>`<article class="card"><h3>${escapeHtml(b.name)}</h3><p>${escapeHtml(b.description||'')}</p><p>单抽 ¥${b.price} · 剩余 ${b.remainCount}</p></article>`).join('')||'<p>暂无在售盲盒</p>'}catch(e){notify(e.message)}}
async function uploadMedia(){const f=$('mediaFile').files[0];if(!f){notify('请选择文件。');return}const form=new FormData();form.append('file',f);try{const d=await api('/api/admin/media/'+$('mediaType').value,{method:'POST',body:form});$('adminOutput').textContent=JSON.stringify(d,null,2);notify('上传成功。')}catch(e){notify(e.message)}}
async function createAlbum(){const productType=$('newProductType').value;const body={title:$('newTitle').value,artist:$('newArtist').value,price:Number($('newPrice').value),stock:Number($('newStock').value),status:1,isLimited:0,productType,coverUrl:$('newCover').value||null};if(productType==='DIGITAL')body.digitalContentUrl=$('newContentUrl').value;try{const id=await api('/api/admin/albums',{method:'POST',body:JSON.stringify(body)});notify('专辑已创建，编号：'+id);loadAlbums()}catch(e){notify(e.message)}}
async function changeRole(){try{await api('/api/admin/users/'+Number($('targetUserId').value)+'/role',{method:'PUT',body:JSON.stringify({role:$('targetRole').value})});notify('用户角色已更新。')}catch(e){notify(e.message)}}
async function loadAudit(){try{const d=await api('/api/admin/audit-logs?current=1&size=50');$('adminOutput').textContent=JSON.stringify(d.records||[],null,2)}catch(e){notify(e.message)}}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
showApp();
</script>
</body>
</html>
