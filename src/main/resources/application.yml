
server:
  port: 8080

spring:
  application:
    name: music-system

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 105MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/music_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000

  data:
    redis:
      host: localhost
      port: 6379
      password: ""
      database: 0
      timeout: 5s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*.xml

jwt:
  # 请通过环境变量 JWT_SECRET 配置足够强的 Base64 密钥
  secret: ${JWT_SECRET}
  expiration: 86400000
  refresh-expiration: 1209600000
